<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>天桥GTA - Tianqiao GTA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; touch-action: none; }
    
    /* Loading Screen */
    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; transition: opacity 0.5s;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-screen h1 {
      font-family: 'Arial Black', sans-serif; font-size: clamp(32px, 8vw, 48px);
      color: #e94560; text-shadow: 0 0 20px rgba(233,69,96,0.5);
      margin-bottom: 20px; letter-spacing: 4px; text-align: center;
    }
    #loading-screen .subtitle {
      font-family: Arial, sans-serif; font-size: clamp(14px, 4vw, 18px);
      color: #aaa; margin-bottom: 30px; letter-spacing: 2px;
    }
    #loading-bar-container {
      width: min(300px, 70vw); height: 6px; background: #333; border-radius: 3px; overflow: hidden;
    }
    #loading-bar {
      width: 0%; height: 100%; background: #e94560; transition: width 0.3s;
    }
    #start-btn {
      display: none; margin-top: 30px; padding: 15px 40px;
      font-size: 18px; font-family: 'Arial Black', sans-serif;
      background: #e94560; color: white; border: none; border-radius: 30px;
      cursor: pointer; letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(233,69,96,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #start-btn:active {
      transform: scale(0.96);
    }

    /* HUD */
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 100; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Minimap */
    #minimap {
      position: absolute;
      top: 15px; left: 15px;
      width: 140px; height: 140px;
      background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #minimap canvas { width: 100%; height: 100%; }

    /* Mission Progress */
    #mission-panel {
      position: absolute; top: 15px; right: 15px;
      background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 10px 14px; min-width: 170px; max-width: 240px;
      color: white; backdrop-filter: blur(4px);
    }
    #mission-panel h3 {
      font-size: 13px; color: #e94560; margin-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;
    }
    .mission-item {
      font-size: 11px; padding: 3px 0; display: flex; align-items: center; gap: 6px;
    }
    .mission-item .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .mission-item .dot.pending { background: #666; }
    .mission-item .dot.active { background: #f1c40f; box-shadow: 0 0 6px #f1c40f; }
    .mission-item .dot.done { background: #2ecc71; }
    .mission-item.done { color: #888; text-decoration: line-through; }

    /* Interaction Prompt */
    #interaction-prompt {
      position: absolute; bottom: 45%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: white; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; display: none;
      border: 1px solid #e94560; pointer-events: auto; cursor: pointer;
      box-shadow: 0 4px 15px rgba(233,69,96,0.3);
      white-space: nowrap;
    }
    #interaction-prompt kbd {
      background: #e94560; padding: 2px 7px; border-radius: 4px;
      font-weight: bold; margin: 0 3px;
    }

    /* Dialogue Box */
    #dialogue-box {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      width: min(600px, 92%);
      background: rgba(15, 23, 42, 0.95); border: 2px solid #e94560;
      border-radius: 12px; padding: 16px 20px; display: none; color: white;
      pointer-events: auto; cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
    }
    #dialogue-box .npc-name {
      color: #e94560; font-weight: bold; font-size: 15px; margin-bottom: 6px;
    }
    #dialogue-box .dialogue-text {
      font-size: 14px; line-height: 1.5; margin-bottom: 10px; min-height: 40px;
    }
    #dialogue-box .dialogue-hint {
      font-size: 11px; color: #888; text-align: right;
    }

    /* Vehicle indicator */
    #vehicle-indicator {
      position: absolute; top: 165px; left: 15px;
      background: rgba(0,0,0,0.75); color: #2ecc71; padding: 6px 12px;
      border-radius: 6px; font-size: 12px; display: none;
      border: 1px solid #2ecc71;
    }

    /* Controls help (PC only) */
    #controls-help {
      position: absolute; bottom: 15px; right: 15px;
      background: rgba(0,0,0,0.6); color: #bbb; padding: 8px 12px;
      border-radius: 6px; font-size: 11px; line-height: 1.7;
      pointer-events: none;
    }

    /* Crosshair (PC only) */
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 4px; height: 4px; background: rgba(255,255,255,0.6); border-radius: 50%;
    }

    /* Mobile Touch Controls */
    #touch-controls {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 150;
    }

    /* Joystick Area */
    #joystick-zone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 140px;
      height: 140px;
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-base {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }
    #joystick-knob {
      width: 50px;
      height: 50px;
      background: rgba(233, 69, 96, 0.85);
      border: 2px solid #fff;
      border-radius: 50%;
      position: absolute;
      transform: translate(0px, 0px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* Touch Look Area (Right screen touch swipe) */
    #touch-look-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 55%;
      height: 100%;
      pointer-events: auto;
      touch-action: none;
    }

    /* Action Buttons Area */
    #touch-action-buttons {
      position: absolute;
      bottom: 25px;
      right: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 15px;
      align-items: flex-end;
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: white;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.1s, background 0.1s, border-color 0.1s;
    }
    .touch-btn:active {
      transform: scale(0.92);
      background: rgba(233, 69, 96, 0.7);
    }
    .touch-btn.active {
      background: #e94560;
      border-color: #fff;
      box-shadow: 0 0 15px rgba(233, 69, 96, 0.7);
    }
    .touch-btn .btn-icon {
      font-size: 18px;
      line-height: 1;
      margin-bottom: 2px;
    }
    .touch-btn .btn-label {
      font-size: 9px;
      letter-spacing: 0.5px;
    }

    #btn-dialogue.highlight {
      border-color: #f1c40f;
      background: rgba(241, 196, 15, 0.4);
      animation: pulse 1s infinite alternate;
    }
    #btn-vehicle.highlight {
      border-color: #2ecc71;
      background: rgba(46, 204, 113, 0.4);
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    /* Win screen */
    #win-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; z-index: 200;
      flex-direction: column; align-items: center; justify-content: center;
      color: white; font-family: 'Arial Black', sans-serif; text-align: center;
      padding: 20px;
    }
    #win-screen h1 { font-size: clamp(28px, 6vw, 48px); color: #2ecc71; margin-bottom: 15px; }
    #win-screen p { font-size: clamp(14px, 3.5vw, 20px); color: #aaa; }

    /* Mobile media queries */
    @media (max-width: 768px) {
      #controls-help { display: none; }
      #crosshair { display: none; }
      #touch-controls { display: block; }
      #minimap { width: 110px; height: 110px; top: 10px; left: 10px; }
      #vehicle-indicator { top: 125px; left: 10px; font-size: 11px; padding: 4px 8px; }
      #mission-panel { top: 10px; right: 10px; padding: 8px 10px; min-width: 140px; }
      #mission-panel h3 { font-size: 11px; }
      .mission-item { font-size: 10px; }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1>天桥 GTA</h1>
    <div class="subtitle">TIANQIAO GTA</div>
    <div id="loading-bar-container">
      <div id="loading-bar"></div>
    </div>
    <button id="start-btn" onclick="startGame()">开 始 游 戏</button>
  </div>

  <!-- HUD -->
  <div id="hud" style="display:none;">
    <div id="minimap"><canvas id="minimap-canvas" width="180" height="180"></canvas></div>
    
    <div id="mission-panel">
      <h3>📋 任务进度</h3>
      <div id="mission-list"></div>
    </div>

    <div id="interaction-prompt">按 <kbd>E</kbd> 与NPC对话</div>
    
    <div id="dialogue-box">
      <div class="npc-name" id="dialogue-npc-name"></div>
      <div class="dialogue-text" id="dialogue-text"></div>
      <div class="dialogue-hint">点击屏幕或按 <kbd>E</kbd> 继续 / 关闭</div>
    </div>

    <div id="vehicle-indicator">🛵 驾驶中 - 按 F 或点击下车</div>

    <div id="controls-help">
      WASD 移动 | 鼠标 视角<br>
      F 上/下车 | E 对话<br>
      Shift 奔跑
    </div>

    <div id="crosshair"></div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls">
      <!-- Joystick (Move) -->
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>

      <!-- Right Touch Area for Camera Look -->
      <div id="touch-look-zone"></div>

      <!-- Action Buttons -->
      <div id="touch-action-buttons">
        <!-- Sprint button -->
        <button id="btn-sprint" class="touch-btn" type="button">
          <span class="btn-icon">⚡</span>
          <span class="btn-label">奔跑</span>
        </button>

        <!-- Vehicle button -->
        <button id="btn-vehicle" class="touch-btn" type="button">
          <span class="btn-icon">🛵</span>
          <span class="btn-label">上下车</span>
        </button>

        <!-- Dialogue / Interact button -->
        <button id="btn-dialogue" class="touch-btn" type="button">
          <span class="btn-icon">💬</span>
          <span class="btn-label">互动(E)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Win Screen -->
  <div id="win-screen">
    <h1>🎉 任务全部完成！</h1>
    <p>恭喜你完成了天桥GTA的所有任务</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
