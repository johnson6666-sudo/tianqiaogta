<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>three-player-controller</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
            }
            #container {
                overflow: hidden !important;
                width: 100vw;
                height: 100vh;
                position: absolute;
                background: transparent;
            }
        </style>
        <script src="./loader.js" data-demo="3DGS Scene"></script>
      <script type="module" crossorigin src="/assets/dgs-Bow_oVNT.js"></script>
      <link rel="modulepreload" crossorigin href="/assets/PlayerController-CfEkDdJ8.js">
      <link rel="modulepreload" crossorigin href="/assets/KTX2Loader-BxDzy3GJ.js">
      <link rel="modulepreload" crossorigin href="/assets/stats.module--VATS4Kh.js">
      <link rel="stylesheet" crossorigin href="/assets/PlayerController-1pHv3Hie.css">
    </head>
    <body>
        <div id="container"></div>

        <div class="hud" role="note" aria-label="Controls">
            <div class="hint-move">
                <div class="hint-cluster">
                    <div class="wasd">
                        <kbd class="wasd-w">W</kbd>
                        <kbd class="wasd-a">A</kbd>
                        <kbd class="wasd-s">S</kbd>
                        <kbd class="wasd-d">D</kbd>
                    </div>
                    <span class="hint-text">Move</span>
                </div>
                <div class="hint-cluster">
                    <div class="hint-mouse" aria-hidden="true">
                        <div class="hint-mouse-body">
                            <span class="hint-mouse-wheel"></span>
                            <span class="hint-mouse-nub"></span>
                        </div>
                    </div>
                    <span class="hint-text">Look</span>
                </div>
            </div>
            <div class="hint-actions">
                <div class="hint-group">
                    <span class="hint-keys"><kbd>Shift</kbd></span>
                    <span class="hint-text">Boost</span>
                </div>
                <div class="hint-group">
                    <span class="hint-keys"><kbd>Space</kbd></span>
                    <span class="hint-text">Jump</span>
                </div>
                <div class="hint-group">
                    <span class="hint-keys"><kbd>V</kbd></span>
                    <span class="hint-text">Toggle View</span>
                </div>
                <div class="hint-group">
                    <span class="hint-keys"><kbd>F</kbd></span>
                    <span class="hint-text">Toggle Fly</span>
                </div>
                <div class="hint-group">
                    <span class="hint-keys"><kbd>Z</kbd></span>
                    <span class="hint-text">Scale Character</span>
                </div>
            </div>
        </div>

        <div class="model-credit">
            3DGS:
            <a href="https://huggingface.co/datasets/spatialverse/InteriorGS/tree/main/0267_840790" target="_blank" rel="noopener noreferrer">Huggingface</a>
        </div>

        <a class="source" href="https://github.com/hh-hang/three-player-controller/blob/master/example/3dgs.js" target="_blank" rel="noopener noreferrer">
            <img src="./img/source.svg" alt="" />
        </a>

    </body>
</html>
